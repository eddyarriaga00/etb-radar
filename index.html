<style>
/* Layout: one column of filters over a card grid; views switch by #hash. Dark-first, matching the Discord bot's violet brand. */
:root {
  --bg: #0d0d14; --panel: #15151f; --panel-2: #1c1b29; --line: #2d2b3d;
  --ink: #f2eefb; --muted: #a59fb8; --violet: #b89cff; --violet-ink: #170f25; --blue: #8db4ff;
  --good: #57f287; --warn: #fee75c; --bad: #ed6a73; --gold: #f0b232;
  --display: 'Space Grotesk', 'Avenir Next', system-ui, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f6f4fb; --panel: #ffffff; --panel-2: #f0ecfa; --line: #ddd6ee;
  --ink: #1b1528; --muted: #5f5874; --violet: #6b46d6; --violet-ink: #ffffff; --blue: #2f5fd0;
  --good: #1a8a46; --warn: #8a6a00; --bad: #b4232f; --gold: #9a6400; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f6f4fb; --panel: #ffffff; --panel-2: #f0ecfa; --line: #ddd6ee;
  --ink: #1b1528; --muted: #5f5874; --violet: #6b46d6; --violet-ink: #ffffff; --blue: #2f5fd0;
  --good: #1a8a46; --warn: #8a6a00; --bad: #b4232f; --gold: #9a6400; color-scheme: light }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
a { color: var(--violet) }
button, select, input { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px }
.wrap > *, main > * { min-width: 0 }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; border-bottom: 1px solid var(--line) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
.brand { display: flex; align-items: center; gap: 10px; font: 700 17px var(--display); letter-spacing: .5px; text-decoration: none; color: var(--ink) }
.brand svg { color: var(--violet) }
nav { display: flex; gap: 4px; flex-wrap: wrap }
nav a { padding: 7px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500 }
nav a[aria-current="page"] { background: var(--panel-2); color: var(--ink) }
.head-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.fresh { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none }
.dot.old { background: var(--warn) }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel-2); text-decoration: none; color: var(--ink); cursor: pointer; font-weight: 500; font-size: 14px }
.btn.primary { background: var(--violet); color: var(--violet-ink); border-color: var(--violet) }

.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.summary button { background: var(--panel); border: 0; padding: 16px 18px; text-align: left; cursor: pointer; display: grid; gap: 2px }
.summary b { font: 700 30px var(--display); font-variant-numeric: tabular-nums }
.summary span { font-size: 13px; color: var(--muted) }
.banner { padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; color: var(--muted) }
.banner.old { border-color: var(--warn); color: var(--ink) }

.filters { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px }
.search { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 13px; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--violet); color: var(--violet-ink); border-color: var(--violet) }
.selects { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px }
.selects label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px }
.selects select { padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; text-transform: none; letter-spacing: 0 }
.selects label, .selects select { min-width: 0 } .selects select { width: 100% }  /* A select is otherwise as wide as its longest option. */
.count { font-size: 14px; color: var(--muted) }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.card-top { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: start }
.thumb { width: 76px; height: 76px; border-radius: 10px; background: #fff; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line) }
.thumb img { width: 100%; height: 100%; object-fit: contain }
.thumb.icon { background: var(--panel-2); color: var(--violet); font: 700 13px var(--display); text-align: center; padding: 6px }
.store { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px }
.name { margin: 2px 0 0; font: 600 15px/1.35 var(--body); text-wrap: balance; overflow-wrap: anywhere }
.price-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.price { font: 700 26px var(--display); font-variant-numeric: tabular-nums }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500 }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.s-in_stock, .s-limited { color: var(--good) } .s-preorder { color: var(--blue) } .s-out_of_stock { color: var(--bad) } .s-unknown, .s-invitation_only { color: var(--muted) }
.tags { display: flex; gap: 6px; flex-wrap: wrap }
.tag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted) }
.tag.deal { color: var(--good) } .tag.over { color: var(--gold) }
.meta { font-size: 12px; color: var(--muted) }
.flip { font-size: 13px; padding: 8px 10px; border-radius: 9px; background: var(--panel-2); display: grid; gap: 2px }
.flip b { font-variant-numeric: tabular-nums } .up { color: var(--good) } .down { color: var(--bad) } .flat { color: var(--gold) }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel) }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 500 }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
tr:last-child td { border-bottom: 0 }
.steps { display: grid; gap: 10px; margin: 0; padding-left: 20px } .steps li { max-width: 70ch }
.rough { font-size: 11px; color: var(--gold); margin-left: 4px }
.call { justify-self: start; font: 700 11px var(--display); letter-spacing: .6px; padding: 2px 7px; border-radius: 6px; background: var(--panel); border: 1px solid currentColor }
.c-buy { color: var(--good) } .c-risky, .c-thin { color: var(--gold) } .c-pass { color: var(--bad) } .c-watch { color: var(--blue) } .c-unknown { color: var(--muted) }
.bd { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; background: var(--panel-2) }
.bd h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.bd p { margin: 0; font-size: 14px }
.bd dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 14px; font-variant-numeric: tabular-nums }
.bd dt { color: var(--muted) } .bd dd { margin: 0; text-align: right }
.bd .total { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 700; color: var(--ink) }
.bd .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px }
.bd .col { background: var(--panel); border-radius: 9px; padding: 8px 10px; display: grid; gap: 2px; font-size: 13px }
.bd .col b { font: 700 20px var(--display) }
.bd .links { display: flex; gap: 8px; flex-wrap: wrap }
.actions { display: grid; grid-template-columns: 1fr auto auto; gap: 6px }
.actions .btn { justify-content: center; padding: 7px 10px; font-size: 13px }
.star[aria-pressed="true"] { color: var(--gold); border-color: var(--gold) }
.more { justify-self: center }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 14px }

.stores { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px }
.store-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; text-align: left; cursor: pointer }
.store-card h3 { margin: 0; font: 600 16px var(--body) }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden } .bar i { display: block; height: 100%; background: var(--good) }

.pulse { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; align-items: start }
.pulse > div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0 }
.pulse h2 { margin: 0; font: 700 17px var(--display) }
.pulse .big { font: 700 34px var(--display); font-variant-numeric: tabular-nums; color: var(--good) }
.targets { display: flex; flex-wrap: wrap; gap: 8px }
.target { display: grid; gap: 2px; padding: 9px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); text-decoration: none; color: var(--ink); min-width: 150px }
.target b { font-variant-numeric: tabular-nums; color: var(--good) } .target span { font-size: 12px; color: var(--muted) }
@media (max-width: 720px) { .pulse { grid-template-columns: 1fr } }
.about { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px }
.about section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0 }
.about h2 { margin: 0 0 10px; font: 700 18px var(--display) }
.about ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px }
.about code { font: 500 13px var(--mono); color: var(--violet) }
h1 { font: 700 clamp(26px, 4vw, 36px)/1.1 var(--display); margin: 10px 0 0; text-wrap: balance }
.lede { margin: 0; color: var(--muted); max-width: 62ch }

.sheet { position: fixed; inset: 0; z-index: 50; background: rgb(5 5 10 / .6); display: grid; justify-items: end }
.sheet[hidden] { display: none }
.sheet-panel { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  padding: max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 24px 18px; display: grid; gap: 16px; align-content: start }
.sheet-panel .thumb { width: 140px; height: 140px }
.hist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.hist div { background: var(--panel-2); border-radius: 10px; padding: 10px; display: grid } .hist b { font: 700 18px var(--display); font-variant-numeric: tabular-nums }
.hist span { font-size: 12px; color: var(--muted) }
.offers { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none }
.offers li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 11px; border-radius: 9px; background: var(--panel-2); font-size: 14px }
.offers b { font-variant-numeric: tabular-nums }
footer { color: var(--muted); font-size: 12px; text-align: center }

@media (max-width: 960px) { .selects { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
@media (max-width: 720px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)) } .summary b { font-size: 24px }
  .selects { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .summary button { padding: 12px 14px }
  header { position: static; gap: 8px 12px }  /* On phones a sticky header would cover too much of the screen. */
  /* Brand and the Discord button share the first row, the views scroll sideways in one row, freshness comes last. */
  .head-right { display: contents }
  .brand { order: 1; margin-right: auto }
  #discord { order: 2 }
  nav { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-right: 28px }
  .hide-sm { display: none !important }
  nav a { white-space: nowrap }
  .fresh { order: 4; width: 100% }
  .pulse > div { padding: 14px }
  .targets { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px } .target { flex: none }
  .about section { padding: 14px }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s } .card:hover { border-color: var(--violet) } }

/* Polish pass: spacing between page sections, honest card states, filter counts, the product sheet and the store groups. */
[hidden] { display: none !important }
main { display: grid; gap: 16px; align-content: start }
.page-head { display: grid; gap: 8px; margin-top: 6px }
.page-head h1 { margin: 0 }
.sec-title { font: 700 20px var(--display); margin: 18px 0 0; display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; scroll-margin-top: 84px }
.sec-title small { font: 500 13px var(--body); color: var(--muted) }
.sec-note { margin: -8px 0 0; font-size: 13px; color: var(--muted); max-width: 80ch }
.jump { display: flex; gap: 6px; flex-wrap: wrap }
.about.plan { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start }
.plan .steps { padding-left: 22px } .plan .steps li { max-width: none }
@media (max-width: 900px) { .about.plan { grid-template-columns: minmax(0, 1fr) } }
.card.live { border-color: var(--line); border-color: color-mix(in srgb, var(--good) 40%, var(--line)) }
.card.gone .thumb img { filter: grayscale(.75); opacity: .7 }
.card.live:hover { border-color: var(--violet) }
.price.none { font: 500 15px var(--body); color: var(--muted) }
.count-row { display: flex; justify-content: space-between; align-items: center; gap: 4px 12px; flex-wrap: wrap; min-height: 28px }
.count-row .count { margin: 0 }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--violet); cursor: pointer; text-decoration: underline; font-size: 14px }
.chip i { font-style: normal; opacity: .75; margin-left: 3px; font-variant-numeric: tabular-nums }
.chip[data-zero="1"]:not([aria-pressed="true"]) { opacity: .55 }
.up-label { color: var(--good) }
.sheet-bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); padding: 4px 0 10px; margin-top: -4px; border-bottom: 1px solid var(--line) }
.sheet-bar .store { min-width: 0; overflow-wrap: anywhere }
.sheet-bar .btn { padding: 6px 12px }
.note { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-size: 14px }
.note.warn { border-color: var(--warn) }
.range { position: relative; height: 6px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); margin: 14px 4px 6px }
.range i { position: absolute; top: -6px; width: 4px; height: 16px; border-radius: 2px; background: var(--violet) }
.about li.grp { font: 700 12px var(--display); text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-top: 6px }
.about li.grp:first-child { margin-top: 0 }
.group-head { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; margin: 6px 0 -4px }
.group-head h2 { margin: 0; font: 700 18px var(--display) }
.store-card.blocked { background: transparent; border-style: dashed }
.store-card .meta b { color: var(--ink); font-weight: 600 }
.about details > summary { cursor: pointer; margin-bottom: 10px }
.about summary h2 { display: inline; margin: 0 }
.legend { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none }
.legend .call { margin-right: 6px }

/* Right-now hero: buyable flips, next drop countdown, hits. */
.hero { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, .8fr) }
@media (max-width: 960px) { .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } .hero .hero-buy { grid-column: 1 / -1 } }
@media (max-width: 720px) { .hero { grid-template-columns: minmax(0, 1fr) } }
.hero > div { position: relative; overflow: hidden }
.hero .hero-buy { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--good) 10%, var(--panel)), var(--panel) 60%) }
.hero .hero-drop { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 10%, var(--panel)), var(--panel) 60%) }
.buy-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--panel-2); text-decoration: none; color: var(--ink) }
.buy-row:hover { outline: 1px solid var(--good) }
.buy-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }
.buy-row .sub { grid-column: 1; font-size: 12px; color: var(--muted) }
.buy-row .chip-profit { grid-row: 1 / span 2; grid-column: 2; font: 700 18px var(--display); color: var(--good); font-variant-numeric: tabular-nums }
.countdown { font: 700 30px var(--display); color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1.1 }

.drop-items li { display: flex; justify-content: space-between; gap: 8px } .drop-items b { color: var(--good); font-variant-numeric: tabular-nums }
.more-link { font-size: 13px; font-weight: 600; text-decoration: none }
.drop-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px }
.win{padding:8px 0;border-top:1px solid var(--line);display:grid;gap:2px}.win:first-of-type{border-top:0}.win .countdown{font-size:18px}.win.open .countdown{color:var(--good)}
.sellinfo p{margin:6px 0 0;font-size:14px}

.drop-card.soon { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)) }
.drop-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px }

.store-links { display: flex; flex-wrap: wrap; gap: 6px } .store-links a { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); text-decoration: none }
.tips { display: grid; gap: 6px; margin: 0; padding-left: 18px; font-size: 14px }
</style>

<div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const usd = n => n == null ? ', ' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const ago = t => { if (!t) return 'not checked yet'; const m = Math.max(0, Math.round((Date.now() / 1000 - t) / 60)); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const store = (k, v) => { try { v === undefined ? null : localStorage.setItem(k, JSON.stringify(v)); return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const STOCKED = ['in_stock', 'limited', 'preorder'];
const RANK = {in_stock: 0, limited: 1, preorder: 2, out_of_stock: 4, unknown: 5, invitation_only: 3};
const VIEWS = {browse: 'Browse', deals: 'MSRP deals', flip: 'Flip guide', drops: 'Drops', instore: 'In store', stores: 'Stores', saved: 'Saved', about: 'How it works'};
const GAME = {pokemon: '⚡', one_piece: '🏴‍☠️', electronics: '🎮'};
// Release pages usually go live overnight, so count down to midnight local time on the release date.
const dropTime = d => new Date(d.date + 'T00:00:00').getTime();
function countdown(ms) {
  const s = Math.max(0, Math.round((ms - Date.now()) / 1000));
  if (s === 0) return 'live now';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function tickCountdowns() { document.querySelectorAll('[data-countdown]').forEach(el => { el.textContent = countdown(+el.dataset.countdown); }); }
const SORTS = {flip: 'best flip first', value: 'MSRP deals first', low: 'lowest price first', high: 'highest price first', recent: 'recently checked first'};
const REFRESH_AFTER = 600;  // Seconds before coming back to the tab fetches fresh stock.

let data = null, names = {}, saved = new Set(store('etb-saved') || []), shown = 24, flipShown = 25, loadedAt = 0, opener = null;
// Listings with no flip value are hidden unless "Flip value" is set to Everything.
const DEFAULTS = {q: '', type: 'all', store: 'all', stock: 'all', budget: 'all', sort: 'flip', value: 'profit'};
const f = {...DEFAULTS};
const filtersOn = () => Object.keys(DEFAULTS).some(k => f[k] !== DEFAULTS[k]);
const VALUES = {profit: '💰 Worth flipping', known: 'Worth flipping + no data yet', all: 'Everything (incl. no flip value)'};
const valueOK = p => f.value === 'all' || p.value === 'profit' || (f.value === 'known' && p.value === 'unknown');

const isDeal = p => STOCKED.includes(p.availability) && p.price != null && p.reference && p.price <= p.reference.amount;
const stockTier = p => ['in_stock', 'limited'].includes(p.availability) ? 0 : p.availability === 'preorder' ? 1 : 2;
const flipOf = p => { const b = p.resale && p.resale.breakdown; return b && b.now ? b.now.profit : b && b.msrp ? b.msrp.profit : -1e9; };
const isBulk = p => p.package_format === 'case' || p.package_format === 'multipack';
const checkedText = p => p.coverage === 'restricted' ? '🔎 Check this store yourself, tap Open store for live stock' : p.checked_at ? 'Checked ' + ago(p.checked_at) : 'Not checked yet';

function tags(p) {
  const out = [];
  if (p.reference && p.price != null) {
    const d = p.price - p.reference.amount, pct = Math.round(Math.abs(d) / p.reference.amount * 100);
    out.push(d <= 0 ? `<span class="tag deal">✅ ${d === 0 ? 'At MSRP' : pct + '% under MSRP'}</span>` : `<span class="tag over">⚠️ ${pct}% over MSRP</span>`);
  } else if (p.reference) out.push(`<span class="tag">MSRP ${usd(p.reference.amount)}</span>`);
  const pkg = data.labels.packages[p.package_format];
  if (pkg) out.push(`<span class="tag">${esc(pkg)}</span>`);
  return out.join('');
}

function thumb(p) {
  // Without a photo (or if it fails to load), show the product type instead.
  const label = esc(p.type === 'one_piece' ? 'One Piece' : (data.labels.types[p.type] || 'Sealed').split(' ')[0]);
  if (p.thumb) return `<div class="thumb" data-label="${label}"><img src="${esc(p.thumb)}" alt="" loading="lazy" onerror="const t=this.parentNode;t.classList.add('icon');t.textContent=t.dataset.label"></div>`;
  return `<div class="thumb icon">${label}</div>`;
}

const money = n => (n < 0 ? '−' : '+') + usd(Math.abs(n));
const tone = n => n == null ? '' : n >= 20 ? 'up' : n >= 0 ? 'flat' : 'down';

function flipLine(p) {
  const r = p.resale; if (!r) return '';
  if (r.basis === 'none') return `<div class="flip"><span class="call c-unknown">❔ NO DATA</span><span>No resale data yet, <a href="${esc(r.breakdown.links.ebay_sold)}" target="_blank" rel="noopener">check eBay sold prices</a></span></div>`;
  const call = r.breakdown ? `<span class="call c-${esc(r.breakdown.call)}">${esc(CALLS[r.breakdown.call])}</span>` : '';
  const how = r.basis === 'live' ? ' (live shop prices)' : r.basis === 'listing' ? " (from this shop's price)" : '';
  const resale = `<span>≈<b>${usd(r.market)}</b> resale${how}${r.confidence === 'rough' ? '<span class="rough">rough</span>' : ''}</span>`;
  // Paying the listed price only makes sense while it can be bought; a sold-out price is a "what if it comes back".
  const buyable = ['in_stock', 'limited', 'preorder'].includes(p.availability);
  const same = r.profit_at_price != null && r.profit_at_msrp != null && Math.abs(r.profit_at_price - r.profit_at_msrp) < .005;
  const here = r.profit_at_price == null ? ''
    : buyable ? `<span>${esc(r.label)}: <b class="${tone(r.profit_at_price)}">${money(r.profit_at_price)}</b> at this price${same ? ` and at MSRP (${usd(r.msrp)})` : ''}</span>`
    : `<span>If it restocks at ${usd(p.price)}: <b class="${tone(r.profit_at_price)}">${money(r.profit_at_price)}</b>${same ? ' (same as MSRP)' : ''}</span>`;
  const atMsrp = r.profit_at_msrp != null && !same ? `<span><b class="${tone(r.profit_at_msrp)}">${money(r.profit_at_msrp)}</b> at MSRP (${usd(r.msrp)})</span>` : '';
  return `<div class="flip">${call}${resale}${here}${atMsrp}</div>`;
}

const CALLS = {buy: '✅ BUY', risky: '⚠️ RISKY', thin: '🟡 THIN', pass: '🔻 PASS', watch: '👀 WATCH', unknown: '❔ NO DATA'};
function breakdownHTML(p) {
  // Same numbers and wording as the bot's "💰 Flip breakdown" field in Discord.
  const r = p.resale, b = r && r.breakdown; if (!b) return '';
  const links = `<div class="links"><a class="btn" href="${esc(b.links.ebay_sold)}" target="_blank" rel="noopener">eBay sold prices</a><a class="btn" href="${esc(b.links.other)}" target="_blank" rel="noopener">${esc(b.links.other_label)}</a></div>`;
  if (b.call === 'unknown') return `<section class="bd" aria-label="Flip check"><h3>💰 Flip check <span class="call c-unknown">${CALLS.unknown}</span></h3><p>${esc(b.advice)}</p>${links}</section>`;
  const tax = Math.round(b.tax_rate * 100);
  const col = (title, c) => c ? `<div class="col"><span class="meta">${title} · ${usd(c.paid)} + ${tax}% tax</span><b class="${tone(c.profit)}">${money(c.profit)}</b><span>${c.roi}% ROI · ${money(c.downside)} if resale −10%</span></div>` : '';
  const same = b.now && b.msrp && Math.abs(b.now.paid - b.msrp.paid) < .01;
  return `<section class="bd" aria-label="Flip breakdown">
    <h3>💰 Flip breakdown <span class="call c-${esc(b.call)}">${esc(CALLS[b.call])}</span></h3>
    <p>${esc(b.advice)}</p>
    <dl><dt>Sells for about${r.basis === 'live' ? ' (live shop prices)' : ''}${r.confidence === 'rough' ? ' <span class="rough">rough</span>' : ''}</dt><dd>${usd(b.sale)}</dd>
      <dt>eBay fees (${+(b.fee_rate * 100).toFixed(2)}% + $0.40)</dt><dd>−${usd(b.fees)}</dd><dt>Shipping to buyer</dt><dd>−${usd(b.shipping)}</dd>
      <dt>Packing + returns reserve</dt><dd>−${usd(b.other)}</dd><dt class="total">You keep</dt><dd class="total">${usd(b.payout)}</dd></dl>
    <div class="cols">${col('At this price', b.now)}${same ? '' : col('At MSRP', b.msrp)}
      <div class="col"><span class="meta">Flip if you pay</span><b>${b.aim ? usd(b.aim) : ', '}</b><span>or less · break-even ${usd(b.break_even)}</span></div></div>
    ${b.platforms && b.platforms.length ? `<div><h3 style="margin:0 0 6px;font-size:14px">Where to sell, what you keep</h3><dl>${b.platforms.map((x, i) => `<dt>${i === 0 ? '⭐ ' : ''}${esc(x.name)}${x.price !== b.sale ? ` <span class="meta">(sells ≈${usd(x.price)})</span>` : ''}</dt><dd${i === 0 ? ' class="up"' : ''}>${usd(x.payout)}</dd>`).join('')}</dl>
      <p class="meta">After each platform's fees${b.platforms.some(x => !x.shipping) ? ', shipping where it ships; local pickup assumes buyers pay about 10% less' : ''}. The profit above uses eBay, the most conservative.</p></div>` : ''}
    ${r.sell ? `<div class="sellinfo"><p><b>🗓️ When to sell:</b> ${esc(r.sell.when)}</p><p><b>📦 Ship it:</b> ${esc(r.sell.box)}, about ${esc(r.sell.weight)}, ${esc(r.sell.service)}.${r.sell.released ? ` Released ${new Date(r.sell.released + 'T12:00:00').toLocaleDateString([], {month: 'short', day: 'numeric', year: 'numeric'})}.` : ''}</p></div>` : ''}
    ${r.note ? `<p class="meta">${esc(r.note)}</p>` : ''}
    ${r.units > 1 ? `<p class="meta">Valued as ${r.units} sealed boxes at ${usd(r.unit_market)} each.</p>` : ''}
    <p class="meta">${r.basis === 'researched' ? 'Researched' : r.basis === 'listing' ? "Estimated from this shop's own price (card shops already charge market)" : 'Live estimate'} ${esc(r.as_of)}${r.source ? ` · <a href="${esc(r.source)}" target="_blank" rel="noopener">price source</a>` : ''}. Verify with sold listings before buying several.</p>
    ${links}
  </section>`;
}

function card(p) {
  const state = data.labels.states[p.availability] || 'Not confirmed';
  const live = ['in_stock', 'limited'].includes(p.availability), gone = p.availability === 'out_of_stock';
  return `<article class="card${live ? ' live' : ''}${gone ? ' gone' : ''}">
    <div class="card-top">${thumb(p)}<div style="min-width:0"><div class="store">${esc(names[p.retailer_id])}</div><h3 class="name">${esc(p.name)}</h3></div></div>
    <div class="price-row">${p.price == null ? '<span class="price none">No price yet</span>' : `<span class="price">${usd(p.price)}</span>`}<span class="pill s-${esc(p.availability)}">${esc(state)}</span></div>
    <div class="tags">${tags(p)}</div>
    ${flipLine(p)}
    <div class="meta">${checkedText(p)}</div>
    <div class="actions"><a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noopener">🛒 Open store</a>
      <button class="btn star" data-save="${p.id}" aria-pressed="${saved.has(p.id)}" aria-label="Save ${esc(p.name)}" title="Save on this device">⭐</button>
      <button class="btn" data-detail="${p.id}" aria-label="Details for ${esc(p.name)}">Details</button></div>
  </article>`;
}

function filtered(list, skip) {
  const words = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  const band = data.labels.budgets[f.budget];
  return list.filter(p => {
    const hay = (p.name + ' ' + names[p.retailer_id] + ' ' + (p.sku || '')).toLowerCase();
    if (words.some(w => !hay.includes(w))) return false;
    if (skip !== 'type' && (f.type === 'bulk' ? !isBulk(p) : f.type !== 'all' && (p.type !== f.type || isBulk(p)))) return false;
    if (f.store !== 'all' && p.retailer_id !== f.store) return false;
    if (!valueOK(p)) return false;
    if (f.stock === 'in_stock' && !['in_stock', 'limited'].includes(p.availability)) return false;
    if (f.stock === 'preorder' && p.availability !== 'preorder') return false;
    if (band && f.budget !== 'all' && (p.price == null || p.price < band[1] || (band[2] != null && p.price >= band[2]))) return false;
    return true;
  }).sort((a, b) => f.sort === 'low' ? (a.price ?? 1e9) - (b.price ?? 1e9) : f.sort === 'high' ? (b.price ?? -1) - (a.price ?? -1)
    : f.sort === 'recent' ? (b.checked_at || 0) - (a.checked_at || 0)
    // Best flip: buyable now first, then preorders, then sold-out listings worth watching; biggest profit first within each.
    : f.sort === 'flip' ? (stockTier(a) - stockTier(b)) || (flipOf(b) - flipOf(a))
    : (isDeal(b) - isDeal(a)) || (RANK[a.availability] - RANK[b.availability]) || (a.price ?? 1e9) - (b.price ?? 1e9));
}

function filtersHTML() {
  const types = [['all', 'Everything'], ...Object.entries(data.labels.types).filter(([k]) => k !== 'other'), ['bulk', 'Cases & bulk']];
  const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`;
  return `<div class="filters">
    <input class="search" id="q" type="search" placeholder="Search a set, product, store or SKU, e.g. 151 bundle" value="${esc(f.q)}" aria-label="Search products (press / to jump here)">
    <div class="chips" role="group" aria-label="Product type">${types.map(([k, l]) => `<button class="chip" data-type="${k}" aria-pressed="${f.type === k}">${esc(l)}<i></i></button>`).join('')}</div>
    <div class="selects">
      <label>Stock<select id="stock">${opt('all', 'Everything', f.stock)}${opt('in_stock', 'In stock now', f.stock)}${opt('preorder', 'Preorders', f.stock)}</select></label>
      <label>Store<select id="store">${opt('all', 'All stores', f.store)}${data.retailers.filter(r => data.products.some(p => p.retailer_id === r.id)).map(r => opt(r.id, r.name, f.store)).join('')}</select></label>
      <label>Budget<select id="budget">${Object.entries(data.labels.budgets).map(([k, b]) => opt(k, b[0], f.budget)).join('')}</select></label>
      <label>Flip value<select id="value">${Object.entries(VALUES).map(([k, l]) => opt(k, l, f.value)).join('')}</select></label>
      <label>Sort<select id="sort">${Object.entries(SORTS).map(([k, l]) => opt(k, l[0].toUpperCase() + l.slice(1), f.sort)).join('')}</select></label>
    </div></div>`;
}

// How many products each type chip would show with the other filters applied, so no chip leads to an empty page.
function updateChips() {
  if (!$('#q')) return;
  const base = filtered(data.products, 'type'), n = {all: base.length, bulk: base.filter(isBulk).length};
  for (const p of base) if (!isBulk(p)) n[p.type] = (n[p.type] || 0) + 1;
  document.querySelectorAll('[data-type]').forEach(b => { const c = n[b.dataset.type] || 0; b.querySelector('i').textContent = c; b.dataset.zero = c ? '' : '1'; });
}

function grid(list, emptyText, browse) {
  const reset = browse && filtersOn() ? '<button class="link-btn" data-reset>Reset filters</button>' : '';
  if (!list.length) return `<div class="empty">${emptyText}${reset ? `<div style="margin-top:10px">${reset}</div>` : ''}</div>`;
  const n = list.length;
  return `<div class="count-row"><p class="count" role="status">${n > shown ? `Showing ${shown} of ${n}` : n} product${n === 1 ? '' : 's'}${browse ? ' · ' + SORTS[f.sort] : ''}</p>${reset}</div>`
    + `<div class="grid">${list.slice(0, shown).map(card).join('')}</div>`
    + (n > shown ? `<button class="btn more" id="more">Show ${Math.min(24, n - shown)} more</button>` : '');
}

const head = (title, lede) => `<div class="page-head"><h1>${title}</h1><p class="lede">${lede}</p></div>`;

function render() {
  const h = location.hash.slice(1), view = VIEWS[h] ? h : 'browse';
  document.querySelectorAll('nav a').forEach(a => a.getAttribute('href') === '#' + view ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.title = (view === 'browse' ? '' : VIEWS[view] + ' · ') + 'ETB Sniper Radar';
  $('#pulse').hidden = view !== 'browse' || !$('#pulse').innerHTML;
  const el = $('#view');
  if (view === 'deals') {
    const deals = data.products.filter(p => isDeal(p) && p.value !== 'none').sort((a, b) => a.price - b.price);
    const noValue = data.products.filter(p => isDeal(p) && p.value === 'none').length;
    // With no deals, say how far the closest in-stock listing sits above its MSRP.
    const near = data.products.filter(p => STOCKED.includes(p.availability) && p.price != null && p.reference && p.price > p.reference.amount)
      .sort((a, b) => a.price / a.reference.amount - b.price / b.reference.amount)[0];
    const closest = near ? ` Closest right now: <a href="${esc(near.url)}" target="_blank" rel="noopener">${esc(near.name)}</a> at ${esc(names[near.retailer_id])}, ${usd(near.price)} (${Math.round((near.price / near.reference.amount - 1) * 100)}% over its ${usd(near.reference.amount)} MSRP).` : '';
    el.innerHTML = head('MSRP deals', 'In stock online at or below MSRP, where we have a sourced MSRP for that exact package. Same list as #deals in Discord.')
      + grid(deals, 'Nothing worth flipping is in stock at or below MSRP right now. The Deal Hunter posts in Discord the moment something is.' + closest)
      + (noValue ? `<p class="meta">${noValue} more at or below MSRP ${noValue === 1 ? 'has' : 'have'} no flip value, see Browse with Flip value set to Everything.</p>` : '');
  } else if (view === 'flip') {
    const g = data.flip, s = g.selling;
    const live = data.products.filter(p => STOCKED.includes(p.availability) && p.resale && p.resale.profit_at_price != null)
      .sort((a, b) => b.resale.profit_at_price - a.resale.profit_at_price);
    const winners = live.filter(p => p.resale.verdict === 'flip');
    const worth = g.rows.filter(r => r.profit_at_msrp >= g.profit_line);
    const hunt = worth.filter(r => r.at_big_store), older = worth.filter(r => !r.at_big_store), skip = g.rows.filter(r => r.profit_at_msrp < g.profit_line);
    const row = r => `<tr><td>${esc(r.product || r.set)}${r.basis === 'live' ? ' <span class="meta">(live shop prices)</span>' : ''}${r.confidence === 'rough' ? '<span class="rough">rough</span>' : ''}</td><td class="num">${usd(r.msrp)}</td><td class="num">${r.source ? `<a href="${esc(r.source)}" target="_blank" rel="noopener">${usd(r.market)}</a>` : usd(r.market)}</td><td class="num">${usd(r.net)}</td><td class="num ${tone(r.profit_at_msrp)}"><b>${money(r.profit_at_msrp)}</b></td></tr>`;
    const msrpTable = rows => '<div class="table-wrap"><table><thead><tr><th>Product</th><th class="num">MSRP</th><th class="num">Resells</th><th class="num">You keep</th><th class="num">Profit at MSRP</th></tr></thead><tbody>' + rows.map(row).join('') + '</tbody></table></div>';
    const listingRow = (p, last) => `<tr><td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></td><td>${esc(names[p.retailer_id])}</td><td class="num">${usd(p.price)}</td><td class="num">${usd(p.resale.market)}</td><td class="num ${tone(last)}"><b>${money(last)}</b></td></tr>`;
    const listingTable = (rows, lastHead, pick) => `<div class="table-wrap"><table><thead><tr><th>Listing</th><th>Store</th><th class="num">Price</th><th class="num">Resells</th><th class="num">${lastHead}</th></tr></thead><tbody>${rows.map(p => listingRow(p, pick(p))).join('')}</tbody></table></div>`;
    const sec = (id, title, note, body) => `<h2 class="sec-title" id="sec-${id}">${title}</h2>${note ? `<p class="sec-note">${note}</p>` : ''}${body}`;
    // On phones the long how-to starts folded so the tables are one scroll away.
    const fold = matchMedia('(min-width: 721px)').matches ? ' open' : '';
    const jumps = [['now', 'In stock now', winners.length], ['hunt', 'Hunt at MSRP', hunt.length], ['older', 'Not at big stores', older.length], ['skip', 'Skip', skip.length], ['all', 'All in-stock listings', live.length]].filter(j => j[2]);
    el.innerHTML = head('Flip guide', `How ETB Sniper makes money: catch a restock at MSRP, buy within the store's limit, and resell sealed at market price. Every number below already takes out the marketplace fee (${(s.fee_rate * 100).toFixed(2)}% + ${usd(s.fee_fixed)}), shipping and ${Math.round(s.sales_tax * 100)}% sales tax. Resale prices researched ${esc(g.researched)}.`)
      + `<section class="about plan"><section><details${fold}><summary><h2>The plan</h2></summary><ol class="steps">
        <li><b>Hunt MSRP, not shelves.</b> Card shops already charge market price, so there is rarely profit buying from them${live.length ? `, right now ${winners.length} of ${live.length} in-stock listings would make $20 or more` : ''}. The profit is in big-store drops (Pokémon Center, Target, Walmart, Best Buy) at MSRP.</li>
        <li><b>Only chase the 🎯 table below.</b> Those are worth $${g.profit_line}+ at MSRP and the big stores we watch carry them. Skip anything in 🔻.</li>
        <li><b>Turn on 💰 Flip Pings and 💎 MSRP Deal Pings</b> in Discord (<code>/alerts</code>), and save the products you want so the bot DMs you (or use <code>/notify</code> for a product or keyword).</li>
        <li><b>Buy within limits and keep it sealed.</b> Resale value is for factory-sealed boxes only.</li>
        <li><b>Sell within a few weeks.</b> Prices fall after reprints: as of ${esc(g.researched)}, Prismatic Evolutions ETB was down about 19% from launch and Ascended Heroes about 14% in 30 days.</li>
        <li><b>Booster boxes and One Piece are the big tickets.</b> A 36-pack Pokémon booster box is $161.64 at MSRP and current sets resell for $180–$390. English One Piece booster boxes are about $120 at retail and resell for $210–$625, so one box at MSRP can clear $100–$400 after fees. Pick 🗃️ Booster Box Pings and 🏴‍☠️ One Piece Pings in Discord. Japanese boxes and cases are kept separate and never borrow these values.</li>
        <li><b>Electronics count too.</b> Limited drops flip like sealed boxes: as of ${esc(g.researched)}, an RTX 5090 Founders Edition ($1,999 at Best Buy) had resold for $4,700–5,150, and the Zelda 40th Anniversary Switch 2 ($519.99) for $750–850. Ordinary consoles don't: a regular Switch 2 resells below MSRP, so it's hidden as no value. Electronics pay eBay's 13.6% fee and need insured shipping, which every number here already includes. Pick 🎮 Electronics Pings in Discord.</li>
        <li><b>Open any product's Details</b> for its full flip breakdown, every fee, what you keep, the most you should pay, and links to eBay sold prices and TCGplayer.</li>

    const blocked = data.retailers.filter(r => { const ps = data.products.filter(p => p.retailer_id === r.id); return ps.length && ps.every(p => p.coverage === 'restricted'); }).map(r => r.name);
    const src = data.sources || [];

      + `<div class="about">
        <section><h2>Who posts in Discord</h2><ul>${data.floor.map(b => `<li>${esc(b.emoji)} <b>${esc(b.name)}</b>, ${esc(b.job)}</li>`).join('')}</ul></section>
        <section><h2>Discord commands</h2><ul>${groups.map(x => (x.g ? `<li class="grp">${esc(x.g)}</li>` : '') + x.items.map(c => `<li><code>${esc(c.name)}</code>, ${esc(c.job)}</li>`).join('')).join('')}</ul></section>
        <section><h2>Reading a listing</h2><ul>
          <li><span class="pill s-in_stock">${esc(data.labels.states.in_stock)}</span>, the store's own data said it was buyable when checked.</li>

          <li><span class="pill s-unknown">${esc(data.labels.states.unknown)}</span>, no fresh check, or the store blocks automatic checks. Open the store to see.</li>
          <li><span class="tag deal">✅ At MSRP</span>, price at or below a sourced MSRP for that exact package.</li>
          <li><span class="tag">${esc(data.labels.packages.case)}</span>, cases and multipacks are kept apart from single boxes.</li>
          <li>Prices exclude shipping and tax. Always confirm price, seller and limits at checkout.</li></ul></section>
      </div>`
      + (src.length ? `<h2 class="sec-title">Where the stock data comes from</h2><p class="sec-note">Each row is a public store page or catalog the monitor reads.${blocked.length ? ` ${blocked.map(esc).join(', ')} block automatic checks, so they are not listed; check them yourself.` : ''}</p>
        <div class="table-wrap"><table><thead><tr><th>Source</th><th class="num">In stock</th><th class="num">Listings</th><th class="num">Last checked</th></tr></thead><tbody>${[...src].sort((a, b) => (b.in_stock || 0) - (a.in_stock || 0)).map(s => `<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(sourceName(s.name))}</a>${s.state === 'current' ? '' : ' <span class="tag over">not verified yet</span>'}</td><td class="num">${s.in_stock ?? ', '}</td><td class="num">${s.products ?? ', '}</td><td class="num">${s.checked_at ? ago(s.checked_at) : ', '}</td></tr>`).join('')}</tbody></table></div>` : '');
  } else {
    el.innerHTML = filtersHTML() + `<div id="results">${grid(filtered(data.products), emptyText(), true)}</div>`;

}

const sourceName = n => n.replace(/ · (\S+)$/, (m, slug) => slug.includes('-') ? ' · ' + slug.replace(/-/g, ' ') : m);
function pulse(d) {

    .sort((a, b) => b.resale.breakdown.now.profit - a.resale.breakdown.now.profit).slice(0, 4);
  const next = ((d.calendar || {}).drops || [])[0];
  el.innerHTML = `<div class="hero-buy"><h2>💰 Buy now</h2>${buy.length
      ? buy.map(p => `<a class="buy-row" href="${esc(p.url)}" target="_blank" rel="noopener"><span class="nm">${esc(p.name)}</span><span class="chip-profit">${money(p.resale.breakdown.now.profit)}</span><span class="sub">${esc(names[p.retailer_id])} · ${usd(p.price)} · ${p.resale.breakdown.now.roi}% ROI</span></a>`).join('')
      : `<span class="meta">Nothing in stock is worth flipping this minute. The bot pings 💰 Flip Pings in Discord the moment that changes.</span>`}
      ${t.length ? `<span class="meta hide-sm">🎯 Buy at or under:</span><div class="targets">${t.slice(0, 4).map(x => `<a class="target" href="${esc(x.url || '#flip')}" target="_blank" rel="noopener"><span>${esc(x.name)}</span><b>${usd(x.max_buy)}</b><span>resells ≈${usd(x.market)}</span></a>`).join('')}</div>` : ''}</div>
    <div class="hero-drop"><h2>📅 Next drop</h2>${next
      ? `<span class="countdown" data-countdown="${dropTime(next)}">${countdown(dropTime(next))}</span><b>${GAME[next.game] || '📦'} ${esc(next.name)}</b>
         <span class="meta">${new Date(next.date + 'T12:00:00').toLocaleDateString([], {weekday: 'long', month: 'short', day: 'numeric'})}${next.best_profit ? ` · up to ${money(next.best_profit)} at MSRP` : ''}</span>
         <ul class="drop-items">${[...next.products].filter(i => i.profit != null).sort((a, b) => b.profit - a.profit).slice(0, 3).map(i => `<li><span>${esc(i.name)}</span><b>${money(i.profit)}</b></li>`).join('')}</ul>
         <a class="more-link" href="#drops">Full drop calendar →</a>`
      : '<span class="meta">No dated releases right now.</span>'}</div>
    <div class="hero-hits"><h2>🏆 Hits this week</h2>${h && h.count
      ? `<span class="big">${money(h.total)}</span><span class="meta">${h.count} profitable alert${h.count === 1 ? '' : 's'} in ${h.days} days, after fees</span>`
        + h.top.slice(0, 2).map(x => `<a class="meta hide-sm" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)} · <b class="up">${money(x.profit)}</b></a>`).join('')
      : '<span class="meta">No profitable alerts in the last 7 days yet.</span>'}</div>`;
  tickCountdowns();
}

const emptyText = () => f.q || f.type !== 'all' || f.store !== 'all' || f.stock !== 'all' || f.budget !== 'all'
  ? 'No products match those filters. Try a shorter search or clear a filter.'
  : 'Nothing worth flipping matches. Set <b>Flip value</b> to “Everything” to see every listing, including ones with no flip value.';
function renderResults() { const r = $('#results'); if (r) { r.innerHTML = grid(filtered(data.products), emptyText(), true); updateChips(); } }

const stockNote = p => p.coverage === 'restricted' ? 'This store blocks automatic checks, so we can’t see its stock. Open the store page to check.'
  : p.availability === 'unknown' ? (p.checked_at ? 'The last check could not confirm this listing’s stock.' : 'Not checked yet, so the stock is unconfirmed.') : '';

function historyHTML(p) {
  const h = p.price_history;
  if (!h) return '<div><h3 style="margin:0 0 8px;font-size:15px">Price history</h3><p class="meta">No price history yet for this listing.</p></div>';
  if (h.checks < 3) return `<div><h3 style="margin:0 0 8px;font-size:15px">Price history</h3><p class="meta">Only ${h.checks} check${h.checks === 1 ? '' : 's'} so far${h.distinct_prices === 1 ? `, at ${usd(h.low)}` : ''}. A trend shows once the monitor has a few more.</p></div>`;
  const span = h.high - h.low, pos = p.price != null && span > 0 ? Math.min(1, Math.max(0, (p.price - h.low) / span)) : null;
  const diff = p.price != null ? p.price - h.median : null;
  const vs = diff == null ? '' : Math.abs(diff) < .005 ? 'Right now it is at the typical price.' : `Right now it is ${usd(Math.abs(diff))} ${diff < 0 ? 'below' : 'above'} the typical price.`;
  return `<div><h3 style="margin:0 0 8px;font-size:15px">Price history <span class="meta">(up to 30 days)</span></h3>
    <div class="hist"><div><span>Low</span><b>${usd(h.low)}</b></div><div><span>Typical</span><b>${usd(h.median)}</b></div><div><span>High</span><b>${usd(h.high)}</b></div></div>
    ${pos == null ? '' : `<div class="range" role="img" aria-label="Current price compared with the 30-day range"><i style="left:calc(${(pos * 100).toFixed(1)}% - 2px)"></i></div>`}
    <p class="meta">${vs} ${h.checks} checks since ${ago(h.first_at)}, at ${h.distinct_prices} different price${h.distinct_prices === 1 ? '' : 's'}.</p></div>`;
}

function detail(id) {

    .sort((a, b) => (RANK[a.availability] - RANK[b.availability]) || a.price - b.price).slice(0, 8) : [];
  const note = stockNote(p);
  opener = document.activeElement;
  $('#sheet-panel').innerHTML = `
    <div class="sheet-bar"><span class="store">${esc(names[p.retailer_id])}</span><div style="display:flex;gap:8px"><button class="btn star" data-save="${p.id}" data-label="1" aria-pressed="${saved.has(p.id)}">${saved.has(p.id) ? '⭐ Saved' : '⭐ Save'}</button><button class="btn" id="close">Close</button></div></div>

    <div class="tags">${tags(p)}</div>

    ${note ? `<div class="note warn">${esc(note)}</div>` : ''}
    ${breakdownHTML(p)}
    ${historyHTML(p)}
    ${others.length ? `<div><h3 style="margin:0 0 8px;font-size:15px">Same product at other stores</h3><ul class="offers">${others.map(o => `<li><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(names[o.retailer_id])}</a><span class="s-${esc(o.availability)}">${esc(data.labels.states[o.availability] || '')}</span><b>${usd(o.price)}</b></li>`).join('')}</ul></div>` : ''}
    <a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noopener">🛒 Open at ${esc(names[p.retailer_id])}</a>`;

function closeSheet() {
  if ($('#sheet').hidden) return;
  $('#sheet').hidden = true; document.body.style.overflow = '';

  opener = null;
}

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const t = e.target.closest('[data-save],[data-detail],[data-type],[data-store],[data-go],[data-reset],[data-jump],[data-flipmore],#more,#close');
  if (!t) return;
  if (t.dataset.save) {
    const id = +t.dataset.save; saved.has(id) ? saved.delete(id) : saved.add(id); store('etb-saved', [...saved]); paintSaved();
    document.querySelectorAll(`[data-save="${id}"]`).forEach(b => { b.setAttribute('aria-pressed', saved.has(id)); if (b.dataset.label) b.textContent = saved.has(id) ? '⭐ Saved' : '⭐ Save'; });
    if (location.hash === '#saved') render();
  }
  else if (t.dataset.detail) detail(+t.dataset.detail);
  else if (t.dataset.type) { f.type = t.dataset.type; shown = 24; document.querySelectorAll('[data-type]').forEach(b => b.setAttribute('aria-pressed', b === t)); renderResults(); }
  else if (t.dataset.store) { Object.assign(f, {store: t.dataset.store, stock: 'all', type: 'all', q: '', value: 'all'}); shown = 24; location.hash = '#browse'; render(); }
  else if (t.dataset.go) { if (t.dataset.stock) Object.assign(f, {stock: t.dataset.stock, type: 'all', store: 'all', q: '', value: t.dataset.stock === 'all' ? 'profit' : 'all'}); shown = 24; location.hash = '#' + t.dataset.go; render(); }
  else if (t.dataset.reset !== undefined) { Object.assign(f, DEFAULTS); shown = 24; render(); }
  else if (t.dataset.jump) { const s = document.getElementById(t.dataset.jump); if (s) s.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'}); }
  else if (t.dataset.flipmore !== undefined) { flipShown += 25; render(); }
  else if (t.id === 'more') { shown += 24; location.hash === '#deals' || location.hash === '#saved' ? render() : renderResults(); }
  else if (t.id === 'close') closeSheet();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { f.q = e.target.value; shown = 24; renderResults(); }
});
document.addEventListener('change', e => {
  if (['stock', 'store', 'budget', 'sort', 'value'].includes(e.target.id)) { f[e.target.id] = e.target.value; shown = 24; renderResults(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  else if (e.key === 'Tab' && !$('#sheet').hidden) {
    // Keep keyboard focus inside the open product sheet.
    const items = [...$('#sheet-panel').querySelectorAll('a[href], button')], first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  else if (e.key === '/' && $('#q') && $('#sheet').hidden && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', () => { shown = 24; flipShown = 25; render(); window.scrollTo(0, 0); });

function paintSaved() { const a = $('nav a[href="#saved"]'); if (a) a.textContent = saved.size ? `Saved (${saved.size})` : 'Saved'; }
function paintFresh() {
  if (!data) return;
  const age = Date.now() / 1000 - data.generated_at, old = age > 7200;
  $('#fresh').innerHTML = `<span class="dot${old ? ' old' : ''}"></span>Stock as of ${new Date(data.generated_at * 1000).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})} · ${ago(data.generated_at)}`;
  const b = $('#banner');
  b.hidden = !(old || data.paused); b.className = 'banner' + (b.hidden ? '' : ' old');
  if (!b.hidden) b.textContent = data.paused ? 'Monitoring is paused right now, so stock below may be out of date.' : 'This page has not refreshed in over 2 hours, the monitor may be offline. Check Discord or the store before buying.';
}

function load(first) {
  return fetch('data.json', {cache: 'no-store'}).then(r => r.json()).then(d => {
    data = d; loadedAt = Date.now() / 1000; names = Object.fromEntries(d.retailers.map(r => [r.id, r.name]));
    paintFresh(); paintSaved();
    const dl = $('#discord'); dl.hidden = !d.discord.welcome; if (d.discord.welcome) dl.href = d.discord.welcome;
    $('#n-stock').textContent = d.products.filter(p => ['in_stock', 'limited'].includes(p.availability)).length;
    $('#n-deals').textContent = d.products.filter(isDeal).length;
    $('#n-products').textContent = d.products.filter(p => p.value === 'profit').length;
    $('#n-stores').textContent = new Set(d.products.map(p => p.retailer_id)).size;
    pulse(d);
    render();
  }).catch(() => { if (first) $('#view').innerHTML = '<div class="empty">Stock data could not load. Refresh the page in a minute.</div>'; });
}

setInterval(paintFresh, 60000);
setInterval(tickCountdowns, 30000);
// Coming back to a tab that has sat for a while: pull fresh stock so nobody clicks a stale "in stock".
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && data && Date.now() / 1000 - loadedAt > REFRESH_AFTER) load(false); });
load(true);
</script>
